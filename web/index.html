<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    $FLUTTER_BASE_HREF is replaced by `flutter build web --base-href`.
    The app is served from the site root ("/"); legacy static pages live
    under /pages/ (see web/pages/README.md).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PhysioConnect – book trusted physiotherapy sessions at your doorstep, manage appointments and pay securely.">
  <meta name="theme-color" content="#0EA5E9">

  <!-- Social previews -->
  <meta property="og:title" content="PhysioConnect">
  <meta property="og:description" content="Book trusted physiotherapy sessions at your doorstep.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PhysioConnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PhysioConnect</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #pc-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: linear-gradient(135deg, #0EA5E9 0%, #22C55E 70%, #A855F7 100%);
      color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #pc-loading .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
      animation: pc-spin 0.9s linear infinite;
    }
    @keyframes pc-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Shown until Flutter paints its first frame. -->
  <div id="pc-loading" aria-live="polite">
    <strong style="font-size: 28px; letter-spacing: .3px;">PhysioConnect</strong>
    <div class="spinner" role="progressbar" aria-label="Loading"></div>
  </div>
  <noscript>PhysioConnect needs JavaScript enabled to run.</noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('pc-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
