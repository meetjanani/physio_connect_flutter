<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhysioConnect — Doctor Onboarding & Practice Growth Presentation</title>
  <style>
    :root {
      --primary: #0369A1;
      --primary-light: #0EA5E9;
      --accent-green: #10B981;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --border: rgba(255, 255, 255, 0.12);
      --slide-gradient: linear-gradient(135deg, #0B132B 0%, #1C2541 55%, #0369A1 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    
    .presentation-container {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 60px rgba(0,0,0,0.45);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      padding: 16px 28px;
      background: rgba(15, 23, 42, 0.7);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: #38BDF8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title span { color: white; font-weight: 500; font-size: 13.5px; }
    .slide-counter {
      background: rgba(56, 189, 248, 0.15);
      color: #7DD3FC;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
    }

    .slide-viewport {
      min-height: 520px;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: var(--slide-gradient);
    }

    .slide-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7DD3FC;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .slide-heading {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 14px;
      color: #F8FAFC;
      letter-spacing: -0.3px;
    }
    .slide-body {
      font-size: 15.5px;
      line-height: 1.65;
      color: #CBD5E1;
      max-width: 950px;
    }
    .slide-body strong { color: #38BDF8; }
    .slide-body ul, .slide-body ol { margin-left: 24px; margin-top: 10px; }
    .slide-body li { margin-bottom: 8px; }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 16px;
    }
    @media (max-width: 768px) {
      .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .slide-viewport { padding: 24px; min-height: auto; }
      .slide-heading { font-size: 22px; }
    }

    .card-dark {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(8px);
    }
    .card-dark .cd-icon { font-size: 22px; margin-bottom: 4px; }
    .card-dark .cd-title { font-size: 14px; font-weight: 800; color: #BAE6FD; margin-bottom: 3px; }
    .card-dark .cd-desc { font-size: 12px; color: #CBD5E1; line-height: 1.45; }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: #94A3B8;
    }

    .bottom-controls {
      padding: 16px 28px;
      background: rgba(15, 23, 42, 0.7);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .nav-btn {
      background: #0369A1;
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-btn:hover:not(:disabled) { background: #0284C7; transform: translateY(-1px); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .dots-container { display: flex; gap: 6px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 999px; background: #475569; cursor: pointer; transition: 0.2s; }
    .dot.active { width: 26px; background: #38BDF8; }

    .btn-action {
      background: #0284C7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-action:hover { background: #0369A1; }

    /* PRINT DECK STYLING (FOR ENTIRE PPT EXPORT) */
    #print-deck-container {
      display: none;
    }

    @media print {
      @page {
        size: landscape;
        margin: 0;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #0B132B !important;
        color: #FFFFFF !important;
        width: 100% !important;
        height: auto !important;
        min-height: 100% !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      .presentation-container {
        display: none !important;
      }
      #print-deck-container {
        display: block !important;
        width: 100% !important;
      }
      .print-slide {
        width: 100vw !important;
        height: 100vh !important;
        max-height: 100vh !important;
        box-sizing: border-box !important;
        padding: 36px 48px !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        background: linear-gradient(135deg, #0B132B 0%, #1C2541 55%, #0369A1 100%) !important;
        color: #FFFFFF !important;
        overflow: hidden !important;
      }
      .slide-heading {
        color: #F8FAFC !important;
        font-size: 24px !important;
        margin-bottom: 12px !important;
      }
      .slide-body {
        color: #E2E8F0 !important;
        font-size: 13.5px !important;
        line-height: 1.55 !important;
      }
      .slide-body strong {
        color: #38BDF8 !important;
      }
      .slide-body ul, .slide-body ol {
        margin-top: 6px !important;
      }
      .slide-body li {
        margin-bottom: 5px !important;
      }
      .card-dark {
        background: rgba(255, 255, 255, 0.08) !important;
        border: 1px solid rgba(255, 255, 255, 0.16) !important;
        padding: 10px 14px !important;
      }
      .card-dark .cd-title {
        color: #BAE6FD !important;
        font-size: 13px !important;
      }
      .card-dark .cd-desc {
        color: #CBD5E1 !important;
        font-size: 11px !important;
      }
      .footer-bar {
        border-top: 1px solid rgba(255, 255, 255, 0.16) !important;
        color: #94A3B8 !important;
        margin-top: 12px !important;
        padding-top: 10px !important;
        font-size: 11px !important;
      }
    }
  </style>
</head>
<body>
  <!-- INTERACTIVE SCREEN VIEWER (1 SLIDE AT A TIME) -->
  <div class="presentation-container">
    <div class="top-bar">
      <div class="brand-title">
        🩺 PhysioConnect <span>| Doctor Onboarding & Growth Deck</span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button class="btn-action" onclick="downloadFullPdf()">📥 Download Full PPT (PDF)</button>
        <span class="slide-counter" id="counter">Slide 1 / 11</span>
      </div>
    </div>

    <div class="slide-viewport" id="viewport">
      <!-- Dynamic slide content -->
    </div>

    <div class="bottom-controls">
      <button class="nav-btn" id="prev-btn" onclick="changeSlide(-1)">← Previous</button>
      <div class="dots-container" id="dots"></div>
      <button class="nav-btn" id="next-btn" onclick="changeSlide(1)">Next →</button>
    </div>
  </div>

  <!-- DEDICATED PRINT CONTAINER (ALL 11 SLIDES RENDERED FOR FULL PDF CONVERSION) -->
  <div id="print-deck-container"></div>

  <script>
    const slides = [

        body: `
          Never lose patient history again. Record detailed clinical documentation right from your mobile device:

      },
      {
        tag: "Slide 11 • 4-Step Onboarding Checklist",
        title: "Join PhysioConnect in 4 Easy Steps Tomorrow! 🚀",
        body: `
          <ol style="line-height: 1.8; font-size: 14.5px; margin-left: 20px;">

          <div style="display:flex; justify-content:center; gap:24px; margin-top:14px;">
            <div style="background:white; padding:8px 14px; border-radius:12px; text-align:center;">
              <img style="width:80px; height:80px; display:block; margin:0 auto 4px;" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.physioconnect.doctor" alt="Doctor App">
              <span style="color:#0369A1; font-weight:800; font-size:11.5px;">Android Doctor App</span>
            </div>
            <div style="background:white; padding:8px 14px; border-radius:12px; text-align:center;">
              <img style="width:80px; height:80px; display:block; margin:0 auto 4px;" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https%3A%2F%2Fphysioconnect.in%2Fdoctor-join" alt="Web Portal">

    let current = 0;

    function renderScreenSlide() {
      const s = slides[current];
      document.getElementById('viewport').innerHTML = `
        <div>
          <span class="slide-tag">${s.tag}</span>
          <div class="slide-heading">${s.title}</div>
          <div class="slide-body">${s.body}</div>
        </div>
        <div class="footer-bar">
          <span style="color:#38BDF8; font-weight:800;">🩺 PhysioConnect • Doctor Practice Guide</span>
          <span>${s.footer}</span>
        </div>
      `;
      document.getElementById('counter').innerText = `Slide ${current + 1} / ${slides.length}`;
      document.getElementById('prev-btn').disabled = current === 0;
      document.getElementById('next-btn').disabled = current === slides.length - 1;

      // Render dots
      const dotsEl = document.getElementById('dots');
      dotsEl.innerHTML = slides.map((_, i) => `<div class="dot ${i === current ? 'active' : ''}" onclick="jump(${i})"></div>`).join('');
    }

    // PREPARE ALL 11 SLIDES FOR FULL PRINT/PDF EXPORT
    function renderPrintDeck() {
      const container = document.getElementById('print-deck-container');
      container.innerHTML = slides.map((s, idx) => `
        <div class="print-slide">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <span class="slide-tag">${s.tag}</span>
              <span style="font-size:12px; color:#7DD3FC; font-weight:800; background:rgba(56,189,248,0.15); padding:4px 12px; border-radius:999px;">Slide ${idx + 1} / ${slides.length}</span>
            </div>
            <div class="slide-heading">${s.title}</div>
            <div class="slide-body">${s.body}</div>
          </div>
          <div class="footer-bar">
            <span style="color:#38BDF8; font-weight:800;">🩺 PhysioConnect • Doctor Practice Guide</span>
            <span>${s.footer}</span>
          </div>
        </div>
      `).join('');
    }

    function changeSlide(dir) {
      current = Math.max(0, Math.min(slides.length - 1, current + dir));
      renderScreenSlide();
    }

    function jump(idx) {
      current = idx;
      renderScreenSlide();
    }

    function downloadFullPdf() {
      renderPrintDeck();
      setTimeout(() => {
        window.print();
      }, 100);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'Space') changeSlide(1);
      else if (e.key === 'ArrowLeft') changeSlide(-1);
    });

    // Initialize both on load
    renderScreenSlide();
    renderPrintDeck();
  </script>
</body>
</html>
